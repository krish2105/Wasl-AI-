# =============================================================================
# WASL AI — SEED URL REGISTRY
# Path in repo: seeds/seed_urls.yaml
# =============================================================================
#
# PURPOSE
#   1. Crawl allowlist. The crawler MUST refuse any domain not listed here or
#      explicitly submitted by a user at runtime.
#   2. Leaderboard population (Phase 8).
#   3. Bootstrap for the 30-site golden eval set (entries flagged `golden: true`).
#
# BEFORE FIRST USE — RUN THE VERIFIER
#   These domains were compiled from general knowledge and are NOT guaranteed
#   live. Companies rebrand, merge, and move domains. Phase 2 must ship
#   `scripts/verify_seeds.py` which:
#     - sends a HEAD request to each url (2s timeout, follow redirects)
#     - records final_url after redirects
#     - marks status: ok | redirected | dead | blocked
#     - writes seeds/seed_urls.verified.yaml
#   Only the verified file feeds the leaderboard. Dead entries are dropped,
#   redirected entries have their url updated in place.
#
# ETHICS
#   Read-only. GET only. robots.txt is authoritative. 0.5 req/s per domain,
#   40 page cap. A robots.txt disallow is recorded as evidence, never bypassed.
#   Publish an opt-out contact on the crawler info page and honour it within 24h.
# =============================================================================

version: 1
updated: 2026-07-25

crawl_policy:
  max_pages_per_domain: 40
  requests_per_second: 0.5
  request_timeout_seconds: 20
  respect_robots: true
  follow_redirects: true
  max_redirect_depth: 3
  render_javascript: true          # capture pre-JS and post-JS DOM separately
  user_agent: "WaslAI-Research/1.0 (+https://wasl.ai/crawler)"
  opt_out_contact: "crawler@wasl.ai"
  allowed_schemes: [https]
  # Never fetch these regardless of robots.txt
  hard_exclude_paths:
    - /checkout
    - /cart
    - /login
    - /signin
    - /register
    - /account
    - /payment
    - /admin
  # Skip binaries — we score markup, not media
  skip_extensions: [.pdf, .zip, .mp4, .mp3, .dmg, .exe, .apk]

