# WASL AI — GOLDEN EVAL SET (30 sites)
#
# =============================================================================
# THIS FILE IS FILLED IN BY A HUMAN, BY HAND. CLAUDE MUST NEVER WRITE A LABEL.
# =============================================================================
#
# If the system under test generates its own ground truth, the eval is circular
# and every number downstream of it is worthless. This scaffold was generated;
# the labels were not, and must not be.
#
# Roughly 2-4 hours. It is the cheapest credibility this project will ever buy.
#
# -----------------------------------------------------------------------------
# HOW TO LABEL A SITE
# -----------------------------------------------------------------------------
#
# Open the site in a normal browser. Look at the actual page source where
# needed (view-source, or devtools). Do NOT run Wasl first and then check
# whether you agree with it — that is how a labeller talks themselves into the
# system's answer.
#
# capabilities:
#   List what an AI agent could actually DO on this site, as read-only
#   operations. See the granularity rule below — it matters more than it looks.
#
# has_openapi_spec / has_jsonld / has_llms_txt / has_agent_manifest:
#   true/false. Check directly: /openapi.json, view-source for
#   application/ld+json, /llms.txt, /.well-known/mcp.json.
#
# expected_band:
#   One of: Invisible | Emerging | Readable | Agent-Ready | Agent-Native
#   Your judgement of where the site lands, made BEFORE seeing Wasl's answer.
#
# notes:
#   Anything that made the call hard. These become the most useful entries when
#   a metric later disagrees with you.
#
# -----------------------------------------------------------------------------
# CAPABILITY GRANULARITY RULE  (settle this before you start, not after)
# -----------------------------------------------------------------------------
#
# Precision and recall are meaningless unless "one capability" means the same
# thing on every site. The rule for this eval set:
#
#   A capability is ONE distinct (verb, noun) pair reachable through ONE
#   mechanism.
#
#   * "search products" and "filter products by price" are ONE capability if the
#     filter is a parameter on the same search endpoint or form. They are TWO if
#     filtering happens through a genuinely separate mechanism.
#
#   * "get product details" and "get product reviews" are TWO capabilities —
#     different nouns, even on the same URL pattern.
#
#   * "search products" and "search services" are TWO capabilities — different
#     nouns — even if one search box covers both. An agent has to know which it
#     is asking for.
#
#   * Pagination, sorting and output format are NEVER separate capabilities.
#     They are parameters.
#
# When genuinely torn, write BOTH readings in `notes` and pick the coarser one.
# Coarse labels understate recall slightly; fine labels inflate it a lot.
#
# -----------------------------------------------------------------------------
# COMPOSITION (matches the spec: 6/5/5/4/4/3/3 = 30)
#   6 e-commerce | 5 real estate | 5 hospitality/travel | 4 government/public
#   4 SaaS/API-first | 3 automotive | 3 logistics
# -----------------------------------------------------------------------------

