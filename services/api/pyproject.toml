[project]
name = "wasl"
version = "0.1.0"
description = "Wasl AI — agent-readiness scoring and MCP server generation for public websites"
requires-python = ">=3.11,<3.12"

# Locked dependency set. One substitution from the master prompt's §7: `mcp[cli]`
# in place of `fastmcp`. The generated servers follow the mcp-builder skill's
# Python guide, which targets the official SDK's FastMCP
# (`from mcp.server.fastmcp import FastMCP`). Approved 2026-07-25.
# Nothing is added here without asking first.
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Agent orchestration
    "langgraph>=0.2.50",
    # LangGraph's Postgres checkpointer ships as a separate distribution. §2 of
    # the master prompt requires it; §7 does not list it. Approved 2026-07-25.
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-core>=0.3",
    "litellm>=1.55",
    "pydantic>=2.9",
    # Crawling and extraction
    "playwright>=1.49",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "extruct>=0.17",
    "jsonschema>=4.23",
    "httpx>=0.28",
    "tenacity>=9.0",
    "pyyaml>=6.0",
    # Data
    "redis>=5.2",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    # Generated MCP servers
    "mcp[cli]>=1.2",
    # Observability
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp>=1.29",
    "langfuse>=2.55",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wasl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:wasl.*"]

[tool.uv]
default-groups = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]
