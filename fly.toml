# Fly.io deployment for the Wasl backend.
#
#     fly launch --no-deploy --copy-config
#     fly volumes create wasl_data --size 3 --region fra
#     fly secrets set DATABASE_URL=... REDIS_URL=... \
#                     WASL_CRAWLER_INFO_URL=... WASL_OPT_OUT_EMAIL=... \
#                     WASL_CORS_ORIGINS=https://wasl-ai-eight.vercel.app
#     fly deploy
#
# Fly rather than Vercel or a serverless host because this service needs three
# things none of them provide: a persistent filesystem for the crawl cache, ~1 GB
# of RAM for headless Chromium, and connections that stay open for the length of
# a scan so the SSE stream is not cut mid-run.

app = "wasl-api"
primary_region = "fra"   # Frankfurt: closest Fly region to the UAE seed list

[build]
  dockerfile = "services/api/Dockerfile"

[env]
  WASL_ENV = "production"
  WASL_LOG_LEVEL = "INFO"
  WASL_PLAYWRIGHT_AVAILABLE = "true"
  WASL_DATA_DIR = "/data"

# Crawl snapshots and generated artifacts. Without this they live in the
# container's writable layer and vanish on every deploy — which means recrawling
# third parties who did not ask to be fetched twice.
[[mounts]]
  source = "wasl_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true

  # NOT auto-stopped. A scan runs for a minute or more and streams events the
  # whole way; suspending the machine between requests would kill live scans and
  # drop the in-memory job store with them.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    # Deliberately low. Each in-flight scan holds a Chromium process; twenty
    # concurrent scans is an OOM, not throughput.
    soft_limit = 8
    hard_limit = 12

  [[http_service.checks]]
    grace_period = "45s"       # cold start plus the browser launch
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "8s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"   # headless Chromium wants ~1GB; 512mb OOMs mid-crawl

# Migrations run once per deploy, before the new machines take traffic.
[deploy]
  release_command = "alembic upgrade head"
  strategy = "immediate"
